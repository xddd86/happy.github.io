<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy mother</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="birthdaycard">
      <div class="cardfront">
        <div class="front-text">
          <h3 class="happy">HAPPY</h3>
          <h2 class="bday">MOTHER'S</h2>
          <h3 class="toyou">day!</h3>
        </div>
        <div class="wrap-deco">
          <div class="decorations"></div>
          <div class="decorationstwo"></div>
        </div>
        <div class="wrap-decotwo">
          <div class="decorations"></div>
          <div class="decorationsthree"></div>
        </div>
        <div class="plate">
          <div class="cake"></div>
          <div class="flame"></div>
        </div>
      </div>
      <div class="cardinside">
        <div class="inside-text">
          <h3 class="happ">HAPPY</h3>
          <h2 class="bda">MOTHER'S</h2>
          <h3 class="toyo">day!</h3>
        </div>
        <div class="whishes">
          <p class="text">Dear Mother</p>
          <p class="text">
            Happy Mother's Day!!! I hope your day is filled with lots of love
            and laughter! I know that you do everything you set your mind to,
            you are the best mother in the world and you fight for your dreams.
          </p>
          <p class="name">att: dael</p>
        </div>
      </div>
    </div>
